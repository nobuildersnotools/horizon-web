[package]
name = "horizon-cosmetics"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Cosmetic items drawn on players by Horizon clients: the item format, attachment to the player model's bones, simple animations, and what other players wear (fetched and cached)"

[dependencies]
horizon-os = { path = "../horizon-os" }
horizon-addresses = { path = "../horizon-addresses" }
base64 = "0.22"
glam = "0.30"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Not in the browser, which has no HTTP client for it: `horizon-ureq-web` stands in there.
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's stand-in for ureq: every request fails as if offline (the crate root names it `ureq`).
horizon-ureq-web = { path = "../horizon-ureq-web" }
