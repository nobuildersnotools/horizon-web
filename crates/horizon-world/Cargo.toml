[package]
name = "horizon-world"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon vanilla world data, NBT, regions and chunk storage"

[dependencies]
horizon-os = { path = "../horizon-os" }
libm = "=0.2.16"
log = "0.4"
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
horizon-core = { path = "../horizon-core" }
horizon-threads = { path = "../horizon-threads" }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
xxhash-rust = { version = "0.8.19", features = ["xxh32"] }

# The binaries hold no tests (the library does): `cargo test` builds no empty test harness for them, each of which
# linked the whole crate again. They still build for integration tests (CARGO_BIN_EXE_*) and clippy --all-targets.
[[bin]]
name = "horizon-world"
path = "src/main.rs"
test = false

[[bin]]
name = "horizon-worldgen-parity"
path = "src/bin/worldgen_parity.rs"
test = false

# Its own name, not `probe`: Cargo copies every crate's examples into one target/<profile>/examples.
[[example]]
name = "world_probe"
path = "examples/probe/main.rs"

[lints]
workspace = true
