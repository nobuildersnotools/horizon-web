[package]
name = "horizon-os"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "The files, clocks and process environment the game uses: std's on native, a virtual filesystem and the browser's clocks on the web"

[dependencies]
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
# chrono's clock reads the browser's Date (std's clock panics on the web).
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

[lints]
workspace = true
