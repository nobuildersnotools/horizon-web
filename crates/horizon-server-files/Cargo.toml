[package]
name = "horizon-server-files"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The dedicated server's vanilla files: server.properties, eula.txt, ops, whitelist and bans, and account lookups"

[dependencies]
horizon-os = { path = "../horizon-os" }
horizon-core = { path = "../horizon-core" }
horizon-protocol = { path = "../horizon-protocol" }
horizon-world = { path = "../horizon-world" }
log = "0.4"
getrandom = "0.3"
# Online mode: finding accounts by name (the services' profiles endpoint).
# Secure chat: the services' public keys arrive base64-encoded.
base64 = "0.22"

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's stand-in for ureq: every request fails as if offline (the crate root names it `ureq`).
horizon-ureq-web = { path = "../horizon-ureq-web" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Not in the browser, which has no HTTP client for it: `horizon-ureq-web` stands in there.
ureq = { version = "2", default-features = false, features = ["tls"] }
