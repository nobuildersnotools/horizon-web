[package]
name = "horizon-official"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The official game executable: the platform's game with Horizon's own in-game parts plugged in (docs/layers.md)"

# The binaries hold no tests (the library does): `cargo test` builds no empty test harness for them, each of which
# linked the whole crate again. They still build for integration tests (CARGO_BIN_EXE_*) and clippy --all-targets.
[[bin]]
name = "horizon-official"
path = "src/main.rs"
test = false

[dependencies]
horizon-game = { path = "../horizon-game" }
horizon-platform = { path = "../horizon-platform" }
horizon-heartbeat = { path = "../horizon-heartbeat" }
horizon-friends = { path = "../horizon-friends", features = ["game"] }
horizon-official-servers = { path = "../horizon-official-servers" }
horizon-discord = { path = "../horizon-discord" }
horizon-perf-share = { path = "../horizon-perf-share" }
log = "0.4"

[build-dependencies]
# The build script runs on the host, but embeds resources based on the target OS.
winresource = "0.1"

[lints]
workspace = true
