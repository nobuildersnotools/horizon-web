name: checks
# verify: every pull request and every push to main, its three parts side by side (below). It is the check main
# requires, so it runs in every run of this workflow, even a cancelled one: a skipped job counts as passed, and every
# run must report a real verify (a pull request that changes no Rust finishes its Rust parts in seconds instead).
# parity: the vanilla harnesses a pull request's changes can affect, on the Mac mini's runner, which holds the
# maintainer's own Minecraft files (Horizon never downloads the game); .github/workflows/parity.yml. Only for a pull
# request that changes a harness, oracle, probe or the runner: the rest are checked on main by parity-main. A fork's pull
# request runs it only when a maintainer adds the run-parity label (.github/workflows/run-parity.yml), so labels
# never start this workflow. See docs/release-flow.md.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # The merge queue: main plus the queued pull requests ahead, checked as main's pushes are (the whole workspace, the
  # launcher). verify is the check the queue waits for; parity and the pull request's crate selection skip it.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
  # The push run asks whether the merge queue's run of the same commit passed (the `queued` steps).
  actions: read
concurrency:
  # A new push to a pull request replaces its running checks. On main, the running check finishes and only the
  # newest push waits behind it: GitHub cancels a waiting run when a newer one joins the group. A burst of merges
  # queued ~100 main runs on 2026-11-09; the release follows the newest finished main run (docs/release-flow.md).
  group: checks-${{ github.event.pull_request.number || (github.event_name == 'push' && 'main') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"

jobs:
  # verify runs as three jobs side by side, so a run takes as long as its slowest part (the Rust tests), not the sum:
  # one job doing them in turn took 14-21 minutes on GitHub's runners (main's run 43595807302: 859 s), and every merge
  # wave waits for main's. `verify` itself is the check main requires: it waits for the three and passes only when
  # each passed or had nothing to do. It runs even in a cancelled run (`always()`), so it fails there instead of being
  # skipped, which GitHub would count as passed. A failed part re-runs alone ("Re-run failed jobs"), not the others.
  #
  # Where (docs/ci-runners.md): our checks runners (label horizon-checks: the desktop's) take this repository's own
  # pull requests whose number ends in 0 or 1, about what their three runners can do; GitHub's runners take the others,
  # forks' pull requests and main's pushes (which also save the Rust cache GitHub's pull request runs read), so both
  # pools work at once. The repository variable SELF_HOSTED_CI moves them: `all` every job to ours, `light` (the
  # desktop paused) or `off` every job to GitHub's. A fork's pull request sees no repository variable, so no switch
  # could move it off a machine that is off: it always runs on GitHub's. On ours the build folder persists
  # (CARGO_TARGET_DIR, outside the checkout), so the apt packages, Python and the Rust cache steps are GitHub's only.
  verify-tree:
    name: verify (tree and tools)
    runs-on: >-
      ${{ vars.SELF_HOSTED_CI != 'off' && vars.SELF_HOSTED_CI != 'light' && (vars.SELF_HOSTED_CI == 'all' ||
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      (endsWith(format('{0}', github.event.pull_request.number), '0') ||
      endsWith(format('{0}', github.event.pull_request.number), '1'))) &&
      fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      # The merge queue merges with merge commits and main moves to the exact commit its merge_group run verified, so
      # that commit's push run would repeat a finished, green verify (~25 runner-minutes, in a queue that builds six
      # groups at once). Only a green merge_group run of this very commit counts; an admin merge never had one, and an
      # API error counts as not tested, so the push then verifies in full. The push run still builds what main's
      # caches hold (the steps below say which).
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      # A pull request or a merge group adds only its own commits to main, so it reads those; main's pushes read every
      # ref's history.
      - name: Keep game artifacts out of Git
        if: steps.queued.outputs.tested != 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          python tools/check_public_tree.py
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            python tools/check_public_tree.py --range "$BASE_SHA..$HEAD_SHA"
          else
            python tools/check_public_tree.py --history
          fi
      # Our runners as GitHub's: some Python tests compile Rust with a bare `rustc` (GitHub's image has a default
      # toolchain, our runners' own rustup homes may not), and the GPU tests find no adapter there, so they return
      # early. Ours have Mesa's software Vulkan for parity; a backend Linux lacks keeps the tests from it, so a pull
      # request's verify doesn't depend on which pool took it (#8627: a GPU test that flakes on lavapipe).
      - name: Our runners as GitHub's (a default Rust toolchain, no GPU)
        if: runner.environment != 'github-hosted'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          echo "WGPU_BACKEND=dx12" >> "$GITHUB_ENV"
      # On a pull request, the next two checks compare with HEAD^1: the main that GitHub's merge commit puts the pull
      # request on. pull_request.base.sha is main at the pull request's last push and falls behind, so main's own
      # changes since then would count as the pull request's (#13874).
      # docs/layers.md: a crate depends only on its own layer or a lower one; today's exceptions only shrink.
      - name: Crates follow the layers
        if: steps.queued.outputs.tested != 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: python3 tools/check_layers.py ${BASE:+--base "$BASE"}
      # docs/layers.md#built-in-addresses: every built-in outside address in the Horizon layer's home; the rest only shrinks.
      - name: Built-in addresses stay in their home
        if: steps.queued.outputs.tested != 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: python3 tools/check_addresses.py ${BASE:+--base "$BASE"}
      - name: Test offline research tooling
        if: steps.queued.outputs.tested != 'true'
        run: python -m unittest discover -s tests -v
  # Not in the merge queue: GitHub's 20 concurrent jobs are what the queue waits for, every pull request passed this
  # job on its own head, and main's push after the merge still runs clippy (a combination that breaks a lint shows
  # there). The required `verify` counts a skipped job as passed.
  verify-lint:
    name: verify (format and lint)
    if: github.event_name != 'merge_group'
    runs-on: >-
      ${{ vars.SELF_HOSTED_CI != 'off' && vars.SELF_HOSTED_CI != 'light' && (vars.SELF_HOSTED_CI == 'all' ||
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      (endsWith(format('{0}', github.event.pull_request.number), '0') ||
      endsWith(format('{0}', github.event.pull_request.number), '1'))) &&
      fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      # The merge queue merges with merge commits and main moves to the exact commit its merge_group run verified, so
      # that commit's push run would repeat a finished, green verify (~25 runner-minutes, in a queue that builds six
      # groups at once). Only a green merge_group run of this very commit counts; an admin merge never had one, and an
      # API error counts as not tested, so the push then verifies in full. The push run still builds what main's
      # caches hold (the steps below say which).
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - name: Does this pull request need Rust checks?
        if: github.event_name == 'pull_request'
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # As in verify-tree: a default toolchain and no GPU, so a part doesn't depend on which pool took it.
      - name: Our runners as GitHub's (a default Rust toolchain, no GPU)
        if: runner.environment != 'github-hosted'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          echo "WGPU_BACKEND=dx12" >> "$GITHUB_ENV"
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        if: steps.rust.outputs.required != 'false'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      # Dependencies and the workspace crates' own clippy output, saved from main's runs (pull requests read main's
      # cache). rust-cache leaves the workspace crates out by default, so clippy re-checked all of them on every run;
      # cache-workspace-crates keeps them, and a new key each UTC day makes main save a fresh copy once a day (the
      # restore falls back to the newest older one). .ci-built holds the commit that copy was checked at.
      - name: Which day's lint cache
        if: steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        id: lint-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        with:
          shared-key: verify-lint
          key: ${{ steps.lint-day.outputs.day }}
          cache-workspace-crates: true
          cache-directories: .ci-built
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Cargo rebuilds a crate whose source file is newer than its saved output, and a checkout stamps every file with
      # the time of the checkout. So on a pull request the files are dated old again, except those that changed since
      # the cached commit, and clippy re-checks only those crates and what depends on them. Without a usable
      # .ci-built/sha the script does nothing and clippy checks everything, as before.
      - name: Date unchanged files as the cache saw them
        if: >-
          github.event_name == 'pull_request' && steps.rust.outputs.required != 'false' &&
          runner.environment == 'github-hosted'
        run: tools/ci/pin_mtimes.sh .ci-built
      - name: Check formatting and lint
        if: steps.rust.outputs.required != 'false'
        # A commit the queue verified skips the format check but still runs clippy: its build is what verify-lint's
        # rust-cache saves from main, and a run that saved nothing would leave pull requests an emptier cache.
        env:
          TESTED: ${{ steps.queued.outputs.tested }}
        run: |
          [ "$TESTED" = true ] || cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      # The server build (released as horizon-engine): the game without sound or controllers. Its libraries and
      # binaries, not the tests and examples the first clippy already checked. Every pull request runs it: the merge
      # queue no longer runs this job, so a change that breaks only the server build must stop on its own pull request
      # (a crate below the client can break it without touching one).
      - name: Lint the server build
        if: steps.rust.outputs.required != 'false'
        run: cargo +stable clippy -p horizon-client --lib --bins --locked --no-default-features -- -D warnings
      # Only main's passing run records its commit; pull requests restore it and never save it.
      - name: Record the commit this lint cache was checked at
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.environment == 'github-hosted'
        run: |
          mkdir -p .ci-built
          git rev-parse HEAD > .ci-built/sha
  verify-test:
    name: verify (Rust tests)
    runs-on: >-
      ${{ vars.SELF_HOSTED_CI != 'off' && vars.SELF_HOSTED_CI != 'light' && (vars.SELF_HOSTED_CI == 'all' ||
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      (endsWith(format('{0}', github.event.pull_request.number), '0') ||
      endsWith(format('{0}', github.event.pull_request.number), '1'))) &&
      fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      # The merge queue merges with merge commits and main moves to the exact commit its merge_group run verified, so
      # that commit's push run would repeat a finished, green verify (~25 runner-minutes, in a queue that builds six
      # groups at once). Only a green merge_group run of this very commit counts; an admin merge never had one, and an
      # API error counts as not tested, so the push then verifies in full. The push run still builds what main's
      # caches hold (the steps below say which).
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - name: Does this pull request need Rust checks?
        if: github.event_name == 'pull_request'
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # As in verify-tree: a default toolchain and no GPU, so a part doesn't depend on which pool took it.
      - name: Our runners as GitHub's (a default Rust toolchain, no GPU)
        if: runner.environment != 'github-hosted'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          echo "WGPU_BACKEND=dx12" >> "$GITHUB_ENV"
      - name: Install Rust toolchain, the ALSA and udev headers the client links against, and the mold linker
        if: steps.rust.outputs.required != 'false'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev mold
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      # Dependencies, and for pull requests the workspace's own build too, saved from main's runs (pull requests read
      # main's cache). The key is the UTC date, so main saves a fresh one each day and a pull request restores the
      # latest. .ci-built/sha, written below, says which main commit that build is of.
      - name: Which day's build cache
        if: steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        id: build-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        with:
          shared-key: verify
          key: ${{ steps.build-day.outputs.day }}
          cache-workspace-crates: true
          cache-directories: .ci-built
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Cargo rebuilds a crate when a source file is newer than its build. Checkout gives every file today's time, so
      # a pull request pins the unchanged files to 2001 and touches the ones that differ from main's built commit. The
      # merge queue and main's pushes skip this and rebuild in full, so a wrong reuse can never reach main.
      - name: Rebuild only what this pull request changed
        if: >-
          github.event_name == 'pull_request' && steps.rust.outputs.required != 'false' &&
          runner.environment == 'github-hosted'
        run: tools/ci/pin_mtimes.sh .ci-built
      # sccache through GitHub's cache, GitHub's runners only (ours keep their build folder): rust-cache keeps the
      # dependencies but cleans the workspace crates and the path-patched ones (third_party), so cargo rebuilt ~70
      # crates on every run. sccache knows them by their content. Only main's pushes write to it: an entry a pull
      # request writes is scoped to that pull request, no other run can read it, and it would push main's entries out
      # of the repository's 10 GB. Pull requests and the merge queue read main's. RUSTC_WRAPPER is set after
      # rust-cache, whose key hashes the RUST* variables.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        with:
          version: v0.19.0
      - name: Compile through sccache
        if: steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        env:
          WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          if [ "$WRITE" != true ]; then echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >> "$GITHUB_ENV"; fi
      # The mold linker, GitHub's runners only (installed above): linking the test binaries was a large part of this
      # job. Rust uses its own lld on x86_64 Linux by default; -linker-features=-lld turns that off so mold's
      # -fuse-ld applies. Set after rust-cache, whose key hashes the RUST* variables, and the same on every event so
      # sccache's hashes match between main and pull requests.
      - name: Link with mold
        if: steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
      # Libraries, binaries and integration tests, then doc tests: not the ~275 examples, which verify-lint's clippy
      # type-checks and the parity job builds and runs (they were most of this step's build and link time).
      # cargo test --locked, not nextest: nextest's process per test reloads each binary's shared tables for every test, and on
      # these 4-core runners it was no faster (#4978).
      # A pull request tests the crates it changes, the crates that depend on them, and the crates whose tests read
      # its files (tools/ci/test_scope.py); a change outside every crate tests the whole workspace. main's pushes
      # always test the whole workspace, so a missed crate shows on main.
      - name: Which crates must the Rust tests cover?
        if: github.event_name == 'pull_request' && steps.rust.outputs.required != 'false'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/test_scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Test Rust core and voxel kernel correctness
        if: steps.rust.outputs.required != 'false'
        env:
          PACKAGES: ${{ steps.scope.outputs.packages }}
          TESTED: ${{ steps.queued.outputs.tested }}
        run: |
          # A commit the queue already tested is only built, with the same arguments, for the caches main saves.
          if [ "$TESTED" = true ]; then
            cargo +stable test --locked ${PACKAGES:---workspace} --lib --bins --tests --no-run
            exit 0
          fi
          cargo +stable test --locked ${PACKAGES:---workspace} --lib --bins --tests
          # The full content-root tests (#[ignore]d: minutes each on a laptop). The same build as above; they need the
          # prepared vanilla data, so without it they pass at once. Keep the target selection identical to avoid
          # recompiling the workspace with a different dependency graph.
          cargo +stable test --locked ${PACKAGES:---workspace} --lib --bins --tests mod_content::tests:: -- --ignored
          cargo +stable test --locked ${PACKAGES:---workspace} --doc
      # What main's cache holds is a build of this commit: pull requests compare their files against it.
      - name: Record the commit this build is of
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        run: mkdir -p .ci-built && git rev-parse HEAD > .ci-built/sha
      - name: What sccache reused
        if: always() && steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        run: |
          "$SCCACHE_PATH" --show-stats
  verify:
    needs: [verify-tree, verify-lint, verify-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part of verify passed or had nothing to do
        env:
          TREE: ${{ needs.verify-tree.result }}
          LINT: ${{ needs.verify-lint.result }}
          TEST: ${{ needs.verify-test.result }}
        run: |
          echo "tree and tools: $TREE, format and lint: $LINT, Rust tests: $TEST"
          for result in "$TREE" "$LINT" "$TEST"; do
            [ "$result" = success ] || [ "$result" = skipped ] || exit 1
          done
  # The launcher is its own workspace (launcher/Cargo.toml), so verify's cargo runs never build it. A pull request that
  # changes it or a crate it builds is checked here, and so are main's pushes when their range changes it: two pull
  # requests can each pass alone and break it together (#2059 and the registry ratings did, 2026-10-26), and the push
  # after their merge shows it. Not in the merge queue, which waits on GitHub's 20 concurrent jobs and does not need
  # this one (only `verify` is required). A push's range is the commits it added to main; a range the job cannot read
  # (a push with no earlier commit, or one a force push removed) runs everything.
  launcher:
    if: github.event_name != 'merge_group'
    runs-on: >-
      ${{ vars.SELF_HOSTED_CI != 'off' && vars.SELF_HOSTED_CI != 'light' && (vars.SELF_HOSTED_CI == 'all' ||
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      (endsWith(format('{0}', github.event.pull_request.number), '0') ||
      endsWith(format('{0}', github.event.pull_request.number), '1'))) &&
      fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      # The merge queue merges with merge commits and main moves to the exact commit its merge_group run verified, so
      # that commit's push run would repeat a finished, green verify (~25 runner-minutes, in a queue that builds six
      # groups at once). Only a green merge_group run of this very commit counts; an admin merge never had one, and an
      # API error counts as not tested, so the push then verifies in full. The push run still builds what main's
      # caches hold (the steps below say which).
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - name: Does this change the launcher or a crate it builds?
        if: github.event_name != 'workflow_dispatch'
        id: launcher
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ] ||
            ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with: the launcher is checked"
          else
            python3 tools/ci/rust_changes.py --launcher "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust and the headers GPUI links against
        if: steps.launcher.outputs.required != 'false'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libwayland-dev \
              libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.launcher.outputs.required != 'false' && runner.environment == 'github-hosted'
        with:
          workspaces: launcher
          shared-key: launcher
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the launcher's formatting, lint and tests
        if: steps.launcher.outputs.required != 'false'
        working-directory: launcher
        env:
          TESTED: ${{ steps.queued.outputs.tested }}
        # A commit the queue verified is only built (clippy, test binaries) for the cache main saves, not run.
        run: |
          [ "$TESTED" = true ] || cargo +stable fmt --check
          cargo +stable clippy --all-targets --locked -- -D warnings
          if [ "$TESTED" = true ]; then
            cargo +stable test --locked --lib --bins --no-run
          else
            cargo +stable test --locked --lib --bins
          fi
  # Compile and test Windows ARM64 on an actual ARM64 host, and inspect the resulting PE headers. By hand only
  # (`gh workflow run checks --ref <branch>`): GitHub's runner queue is the bottleneck, and main's runs gate the
  # releases (tools/release_train.py waits for them), so neither pull requests nor main's pushes start this
  # 90-minute job. The Nightly and launcher releases build and check these binaries on every run.
  windows-arm64:
    name: Windows ARM64 game and launcher
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use every runner core for Cargo
        shell: pwsh
        run: |
          $cores = (Get-CimInstance Win32_Processor | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
          "CARGO_BUILD_JOBS=$cores" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-arm64-game
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: launcher
          shared-key: windows-arm64-launcher
      - name: Check LLVM assembler used by ring
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Get-Command clang -ErrorAction SilentlyContinue) -and (Test-Path (Join-Path $llvmBin 'clang.exe'))) {
            $env:PATH = "$llvmBin;$env:PATH"
            "PATH=$env:PATH" >> $env:GITHUB_ENV
          }
          $clang = Get-Command clang -ErrorAction Stop
          Write-Output "Using $($clang.Source)"
          & $clang.Source --version
      - name: Build the game for native Windows ARM64 (the official game, as game-build.yml ships it)
        run: cargo build --release --locked --target aarch64-pc-windows-msvc -p horizon-official --bin horizon-official -p horizon-client-lib --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server
      - name: Check the game's PE machine
        run: python tools/check_pe_arch.py arm64 target/aarch64-pc-windows-msvc/release/horizon-official.exe target/aarch64-pc-windows-msvc/release/horizon-ctl.exe target/aarch64-pc-windows-msvc/release/horizon-prepare.exe target/aarch64-pc-windows-msvc/release/horizon-server.exe
      - name: Check game DLL imports
        run: python tools/check_imports.py target/aarch64-pc-windows-msvc/release/horizon-official.exe target/aarch64-pc-windows-msvc/release/horizon-ctl.exe target/aarch64-pc-windows-msvc/release/horizon-prepare.exe target/aarch64-pc-windows-msvc/release/horizon-server.exe
      - name: Start every game executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $client = 'target/aarch64-pc-windows-msvc/release/horizon-official.exe'
          $output = & $client --help 2>&1
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch '--resources') { throw 'horizon-client --help failed' }
          foreach ($binary in @('horizon-ctl.exe', 'horizon-prepare.exe', 'horizon-server.exe')) {
            $path = "target/aarch64-pc-windows-msvc/release/$binary"
            $output = & $path --help 2>&1
            if ($LASTEXITCODE -ne 0 -or -not $output) { throw "$binary --help failed" }
          }
          foreach ($binary in @('horizon-prepare.exe', 'horizon-server.exe')) {
            $path = "target/aarch64-pc-windows-msvc/release/$binary"
            $output = & $path --version 2>&1
            if ($LASTEXITCODE -ne 0 -or -not $output) { throw "$binary --version failed" }
            Write-Output ($output -join "`n")
          }
      - name: Test and build the native Windows ARM64 launcher
        working-directory: launcher
        run: |
          cargo test --release --locked --target aarch64-pc-windows-msvc --lib
          cargo build --release --locked --target aarch64-pc-windows-msvc
      - name: Check the launcher's PE machine
        working-directory: launcher
        run: python ../tools/check_pe_arch.py arm64 target/aarch64-pc-windows-msvc/release/horizon-launcher.exe
      - name: Check launcher DLL imports and command-line startup
        working-directory: launcher
        # bash, as launcher.yml's check on the same runner: the launcher is a GUI-subsystem program, and a pwsh
        # `$output = & launcher --version` read no output from it (run 42217014588).
        shell: bash
        run: |
          launcher=target/aarch64-pc-windows-msvc/release/horizon-launcher.exe
          python ../tools/check_imports.py "$launcher"
          out=$("$launcher" --version)
          echo "$out"
          [[ "$out" == "horizon-launcher "* ]] || { echo "::error::horizon-launcher --version printed '$out'"; exit 1; }
      - name: Build a native-mod game with the launcher's managed toolchain
        working-directory: launcher
        shell: pwsh
        env:
          HORIZON_LAUNCHER_HOME: ${{ runner.temp }}\horizon-native-arm64-toolchain
          HORIZON_NATIVE_TARGET_DIR: ${{ runner.temp }}\horizon-native-arm64-toolchain\target
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --release --locked --target aarch64-pc-windows-msvc --lib rust_toolchain::tests::managed_arm64_toolchain_builds_the_game -- --ignored --exact --nocapture
          $client = Join-Path $env:HORIZON_NATIVE_TARGET_DIR 'fast/horizon-client.exe'
          python ../tools/check_pe_arch.py arm64 $client
          python ../tools/check_imports.py $client
  # Most pull requests leave the harnesses to parity-main, which runs them on main a batch of merges at a time
  # (.github/workflows/parity-main.yml; releases wait for it). A pull request still runs them itself when it changes
  # a harness, an oracle, a probe or the runner, or carries the run-parity label (run-parity.yml, when it is added).
  parity-scope:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # A git diff of this repository's own branch: one of our small runners (horizon-light, docs/ci-runners.md).
    runs-on: ${{ vars.SELF_HOSTED_CI != 'off' && fromJSON('["self-hosted", "linux", "horizon-light"]') || 'ubuntu-latest' }}
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          changed=$(git diff --name-only "$(git merge-base "$BASE_SHA" HEAD)" HEAD)
          harness=$(grep -E '^(tools/test_[a-z0-9_]+_parity\.py|tools/(parity[a-z_]*|lab)\.py|tools/parity_hosts\.json|mods/horizon/src/test/|crates/[^/]+/examples/|crates/horizon-client/src/game/[a-z_]*(fixture|harness)\.rs|\.github/workflows/parity[a-z-]*\.yml)' <<< "$changed" || true)
          if [ -n "$harness" ] || [[ " $LABELS " == *" run-parity "* ]] || [[ " $LABELS " == *" frame-identity "* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "The pull request runs its harnesses: ${harness:-label run-parity}"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No harness, oracle, probe or runner change: parity-main checks this on main"
          fi
  parity:
    needs: parity-scope
    if: needs.parity-scope.outputs.run == 'true'
    uses: ./.github/workflows/parity.yml
    with:
      base: ${{ github.event.pull_request.base.sha }}
      head: ${{ github.event.pull_request.head.sha }}
      full: ${{ contains(github.event.pull_request.labels.*.name, 'full-parity') }}
      frame_identity: ${{ contains(github.event.pull_request.labels.*.name, 'frame-identity') }}
  # JFR analysis uses JDK-generated fixture recordings on the self-hosted Linux runner.
  # Start a manual checks dispatch with: gh workflow run checks --ref <branch>.
  jfr-analysis:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, horizon-game]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify streaming JFR analysis against the JDK exporter
        run: python tools/test_jfr.py
      - name: Verify ZGC pause and allocation event interpretation
        run: python tools/test_jfr.py --gc zgc
